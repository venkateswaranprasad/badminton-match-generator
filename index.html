<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Badminton Match Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>🏸 Badminton Match Generator</h1>

<div id="stepIndicator">
  Step <span id="currentStepText">1</span> of 4
</div>

<!-- ================= STEP 1 : SETUP ================= -->
<section id="step1" class="step-card">
  <h2>Setup</h2>

  <label>Group Name</label><br>
  <input type="text" id="clubName"><br><br>

  <button onclick="checkGroupHistory()">Fetch Group</button>
  <button onclick="resetGroupHistory()">Reset Group History</button>

  <p id="historyMessage"></p>
  <div id="historySection" style="display:none;">
    <div id="historyList"></div>
  </div>

  <hr>

  <label>Total Players (new group only)</label><br>
  <input type="number" id="playerCount" min="4"><br><br>

  <label>Matches per Player</label><br>
  <input type="number" id="matchesPerPlayer" min="1" value="1"><br><br>

  <details>
    <summary>Advanced Settings</summary>
    <br>
    <label>Seed</label><br>
    <input type="text" id="seedInput"><br><br>

    <label>Randomness (0–100)</label><br>
    <input type="number" id="randomnessLevel" value="30" min="0" max="100">
  </details>

  <br>
  <button onclick="goNextFromSetup()">Next</button>
</section>

<!-- ================= STEP 2 : PLAYERS + TEAMS ================= -->
<section id="step2" class="step-card" style="display:none;">
  <h2>Players & Teams</h2>

  <div style="display:flex; gap:20px;">
    <!-- LEFT : PLAYERS -->
    <div style="width:50%;">
      <h3>Group Players</h3>
      <p><small>✔ Available Today is checked by default</small></p>

      <div id="playersList"></div>

      <button onclick="addNewPlayer()">Add Player</button>
      <button onclick="toggleManagePlayers()">Manage Players</button>
    </div>

    <!-- RIGHT : TEAMS -->
    <div style="width:50%;">
      <h3>Team Assignment (Today)</h3>
      <div id="teamCounts"></div>
      <div id="teamAssignmentContainer"></div>
    </div>
  </div>

  <p id="teamAssignmentMessage"></p>

  <button onclick="goBack()">Back</button>
  <button onclick="goNextFromTeams()">Generate Schedule</button>
</section>

<!-- ================= STEP 3 : SCHEDULE ================= -->
<section id="step3" class="step-card" style="display:none;">
  <h2>Schedule</h2>

  <div id="matchResults"></div>

  <button onclick="goBack()">Back</button>
  <button onclick="regenerateMatches()">Re-generate</button>
  <button onclick="goNextFromSchedule()">Let’s Play</button>
</section>

<!-- ================= STEP 4 : PLAY ================= -->
<section id="step4" class="step-card" style="display:none;">
  <h2>Play</h2>

  <div id="playMatchesGrid"></div>

  <button onclick="goBack()">Back</button>
  <button onclick="concludePlay()">Conclude Play</button>

  <section id="finalSummarySection" style="display:none;">
    <h2>Final Result</h2>
    <div id="finalHeader"></div>

    <h3>Overall Summary</h3>
    <div id="overallSummary"></div>

    <h3>Match Summary</h3>
    <div id="matchSummary"></div>

    <h3>Player of the Tournament</h3>
    <div id="playerOfTournament"></div>

    <button onclick="saveResults()">Save Results</button>
  </section>
</section>

<script src="app.js?v=5"></script>
</body>
</html>
