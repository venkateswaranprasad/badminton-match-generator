<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Badminton Match Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>🏸 Badminton Match Generator</h1>

<section>
  <label>Club / Group Name</label><br>
  <input type="text" id="clubName"><br><br>

  <label>Total Number of Players</label><br>
  <input type="number" id="playerCount" min="1">

  <label>Matches per Player</label><br>
  <input type="number" id="matchesPerPlayer" min="1" value="1"><br><br>

  <button onclick="createPlayerInputs()">Next</button>
</section>

<section id="playersSection"></section>

<button id="generateBtn" onclick="generateMatches()" style="display:none;">
  Assign Teams
</button>

<p class="note">
  ⚠️ Note: Currently, only <strong>doubles matches (2 vs 2)</strong> are supported.
</p>

<!-- NEW: Team Assignment Section -->
<section id="teamAssignmentSection" style="display:none;">
  <h2>Assign Players to Teams</h2>

  <div id="teamAssignmentContainer"></div>

  <button onclick="generateMatchesFromTeams()">Generate Matches</button>
  <p id="teamAssignmentMessage"></p>
</section>

  <section id="matchSection" style="display:none;">
  <h2>Scheduled Matches</h2>
  <div id="matchResults"></div>
</section>

<script src="app.js"></script>
</body>
</html>
