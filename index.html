<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Badminton Match Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>🏸 Badminton Match Generator</h1>

<section>
  <label>Club / Group Name</label><br>
  <input type="text" id="clubName"><br><br>

  <label>Total Number of Players</label><br>
  <input type="number" id="playerCount" min="1">
  <button onclick="createPlayerInputs()">Next</button>
</section>

<section id="playersSection"></section>

<button id="generateBtn" onclick="generateMatches()" style="display:none;">
  Generate Matches
</button>

<p class="note">
  ⚠️ Note: Currently, only <strong>doubles matches (2 vs 2)</strong> are supported.
</p>

<section id="teamSection" style="display:none;">
  <h2>Doubles Team Selection</h2>

  <h3>Side A</h3>
  <select id="teamA1"></select>
  <select id="teamA2"></select>

  <h3>Side B</h3>
  <select id="teamB1"></select>
  <select id="teamB2"></select>

  <br><br>
  <button onclick="validateTeams()">Validate Teams</button>

  <p id="teamMessage"></p>
</section>

<script src="app.js"></script>
</body>
</html>
